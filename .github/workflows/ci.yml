name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check plugin tests
      - name: Manifest sanity
        shell: python
        run: |
          import re, sys
          from pathlib import Path
          m = (Path("plugin") / "plugin.yaml").read_text(encoding="utf-8")
          assert re.search(r"^name:\s*deep-think$", m, re.M)
          assert re.search(r"^version:\s*\d+\.\d+\.\d+$", m, re.M)
          assert "- deep_think" in m
          print("manifest OK")
          sys.exit(0)
